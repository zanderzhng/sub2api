name: Pi Image

# Fork-local image build for the pi-impersonation fork.
#
# Deliberately NOT wired to version tags: this fork ships a custom build and must
# not claim an upstream version number. Images are published under moving
# `pi-custom` and immutable `pi-<short-sha>` tags on GHCR.
#
# Builds from source (root Dockerfile) on a native linux/amd64 runner, so the
# cgo-linked libzstd used for pi's zstd level-3 request bodies is compiled for
# the target architecture without emulation.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Moving image tag to publish'
        required: false
        type: string
        default: pi-custom

concurrency:
  group: pi-image-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64 image
        env:
          MOVING_TAG: ${{ inputs.tag || 'pi-custom' }}
          REPO_LOWER: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO_LOWER,,}"
          short_sha="${GITHUB_SHA::12}"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --file Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${image}:${MOVING_TAG}" \
            --tag "${image}:pi-${short_sha}" \
            --push \
            .
          echo "pushed ${image}:${MOVING_TAG} and ${image}:pi-${short_sha}" >> "$GITHUB_STEP_SUMMARY"
      - name: Report digest
        env:
          MOVING_TAG: ${{ inputs.tag || 'pi-custom' }}
          REPO_LOWER: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO_LOWER,,}"
          docker buildx imagetools inspect "${image}:${MOVING_TAG}" --format '{{json .Manifest}}' \
            | tee manifest.json
          echo "image=${image}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$(docker buildx imagetools inspect "${image}:${MOVING_TAG}" --format '{{.Manifest.Digest}}')" >> "$GITHUB_STEP_SUMMARY"
