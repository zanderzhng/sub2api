name: Pi Image

# Fork-local image build for the pi-impersonation fork.
#
# Deliberately NOT wired to version tags and NOT dependent on a registry: this
# fork ships a custom build and must not claim an upstream version number, and
# GHCR packages of this fork are private (their visibility can only be changed
# by a user token with packages scope, which CI does not have).
#
# The workflow builds the image from source (root Dockerfile) on a native
# linux/amd64 runner, so the cgo-linked libzstd used for pi's zstd level-3
# request bodies is compiled for the target architecture without emulation, then
# exports a docker-save tar as an artifact. Deploy by loading that tar on the
# target host:
#
#   gh run download <run-id> --repo zanderzhng/sub2api -n sub2api-pi-image -D /tmp/pi-image
#   scp /tmp/pi-image/sub2api-pi.tar zgo1:/opt/sub2api/
#   ssh zgo1 'docker load -i /opt/sub2api/sub2api-pi.tar'
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag baked into the tar (local tag on the target host)'
        required: false
        type: string
        default: pi-custom
      retention_days:
        description: 'Artifact retention (days)'
        required: false
        type: number
        default: 7

concurrency:
  group: pi-image-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image into a tar
        env:
          MOVING_TAG: ${{ inputs.tag || 'pi-custom' }}
          REPO_LOWER: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO_LOWER,,}"
          short_sha="${GITHUB_SHA::12}"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --file Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${image}:${MOVING_TAG}" \
            --tag "${image}:pi-${short_sha}" \
            --output "type=docker,dest=/tmp/sub2api-pi.tar" \
            .
          ls -lh /tmp/sub2api-pi.tar
          {
            echo "image=${image}:${MOVING_TAG}"
            echo "immutable=${image}:pi-${short_sha}"
            echo "revision=${GITHUB_SHA}"
            echo "tar_bytes=$(stat -c %s /tmp/sub2api-pi.tar)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image tar
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-pi-image
          path: /tmp/sub2api-pi.tar
          retention-days: ${{ inputs.retention_days || 7 }}
          compression-level: 1
